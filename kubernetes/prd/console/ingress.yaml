apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-ops-console-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    # Internal-only since the 2026-11 exposure review: nothing internet-facing. Callers (gai-api-backend,
    # article-ml-analysis-interface) run inside common-0 and keep using https://llm-ops.smartnews.net, which
    # external-dns repoints to the internal ALB's private addresses. AWS can't change a scheme in place, so
    # applying this replaces the ALB.
    alb.ingress.kubernetes.io/scheme: internal
    # spaas_sn_worker_node: private VPC ranges only. zscaler-news is dropped.
    alb.ingress.kubernetes.io/security-groups: sg-0076cb5e92a093750
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    # The certificate the HTTPS listener already serves (*.smartnews.net), pinned instead of auto-discovered.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-1:165463520094:certificate/8724ebb7-dd86-45c5-90a9-7f592f66fe53
    alb.ingress.kubernetes.io/tags: Env=production,Cost=smartnews,System=gai-platform,Component=llm-ops-console,Team=ai-infrastructure
    # /ping is a 404 on this server, so the target was never healthy: the pod never became Ready and the ALB only
    # served it by failing open. /api/healthz answers 200.
    alb.ingress.kubernetes.io/healthcheck-path: /api/healthz
    alb.ingress.kubernetes.io/success-codes: "200"
    # Access logs, as the 2026-11 exposure review requires. smartnews-log admits ELB log delivery under alb/*.
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=smartnews-log,access_logs.s3.prefix=alb/llm-ops-prd
    external-dns.alpha.kubernetes.io/hostname: llm-ops.smartnews.net
    alb.ingress.kubernetes.io/ip-address-type: dualstack
spec:
  rules:
    - host: llm-ops.smartnews.net
      http:
        paths:
          # Only the API-key-authenticated prompt API the callers read. /graphql (trusts an unsigned email header)
          # and the console redirect are no longer routed; anything else gets the listener's default 404.
          - path: /api/prompts/v2/
            pathType: Prefix
            backend:
              service:
                name: llm-ops-server
                port:
                  number: 3000
